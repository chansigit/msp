<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="msp-logo-title msp-logo-desc">
  <title id="msp-logo-title">MSP — a shared cell atlas</title>
  <desc id="msp-logo-desc">Three distinct organic populations share intertwined blue,
    jade, and amber bands. Shape represents biological identity; the recurring
    colors represent samples integrated into each population. The transparent space
    between the populations forms an M, enclosed by a fine circular border.
    An abstract mark, not a data plot.</desc>

  <defs>
    <!-- The population boundaries leave an open M-shaped channel. The letter
         is transparent negative space, not a glyph painted over the populations. -->
    <path id="population-a" d="M227 88C183 73 134 99 106 137C76 177 68 221 83 265
      C94 298 115 325 132 341C139 347 145 349 145 337V180C145 162 151 148 162 148C173 148 184 162 196 177
      L239 232C246 241 251 235 250 222L250 129C249 107 242 93 227 88Z"/>
    <path id="population-b" d="M283 88C324 75 372 99 403 139C433 178 443 220 429 263
      C418 298 397 325 380 341C373 347 367 349 367 337V180C367 162 361 148 350 148C339 148 328 162 316 177
      L273 232C266 241 261 235 262 222L262 129C263 107 269 93 283 88Z"/>
    <path id="population-c" d="M181 225C181 211 187 207 197 220L239 273
      C250 287 262 287 273 273L315 220C325 207 331 211 331 225V344
      C331 388 302 418 264 426C224 434 187 404 182 362C180 340 181 298 181 225Z"/>
    <clipPath id="clip-a"><use href="#population-a"/></clipPath>
    <clipPath id="clip-b"><use href="#population-b"/></clipPath>
    <clipPath id="clip-c"><use href="#population-c"/></clipPath>
  </defs>

  <!-- Each population contains the same three sample colors. The bands bend
       together within a population, rather than converging into one central hub. -->
  <!-- A shared circular frame holds the distinct populations in one atlas. -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#2855BD" stroke-width="6"/>
  <g>
    <g clip-path="url(#clip-a)">
      <use href="#population-a" fill="#2855BD"/>
      <path d="M78 92C96 130 125 141 155 147C193 155 213 176 224 205C235 235 222 265 218 285"
            fill="none" stroke="#FFFFFF" stroke-width="79"/>
      <path d="M78 92C96 130 125 141 155 147C193 155 213 176 224 205C235 235 222 265 218 285"
            fill="none" stroke="#20AD98" stroke-width="68"/>
      <path d="M60 154C94 184 119 187 144 196C171 206 185 239 179 282"
            fill="none" stroke="#FFFFFF" stroke-width="40"/>
      <path d="M60 154C94 184 119 187 144 196C171 206 185 239 179 282"
            fill="none" stroke="#F0B54D" stroke-width="29"/>
    </g>

    <g clip-path="url(#clip-b)">
      <use href="#population-b" fill="#2855BD"/>
      <path d="M339 100C391 119 411 141 408 175C405 210 379 234 397 294"
            fill="none" stroke="#FFFFFF" stroke-width="65"/>
      <path d="M339 100C391 119 411 141 408 175C405 210 379 234 397 294"
            fill="none" stroke="#20AD98" stroke-width="54"/>
      <path d="M321 126C353 149 365 165 365 187C365 216 352 240 365 288"
            fill="none" stroke="#FFFFFF" stroke-width="33"/>
      <path d="M321 126C353 149 365 165 365 187C365 216 352 240 365 288"
            fill="none" stroke="#F0B54D" stroke-width="22"/>
    </g>

    <g clip-path="url(#clip-c)">
      <use href="#population-c" fill="#2855BD"/>
      <path d="M148 290C187 282 217 299 242 321C268 344 299 352 356 328"
            fill="none" stroke="#FFFFFF" stroke-width="69"/>
      <path d="M148 290C187 282 217 299 242 321C268 344 299 352 356 328"
            fill="none" stroke="#20AD98" stroke-width="58"/>
      <path d="M155 353C195 335 220 357 245 375C274 396 305 398 355 371"
            fill="none" stroke="#FFFFFF" stroke-width="34"/>
      <path d="M155 353C195 335 220 357 245 375C274 396 305 398 355 371"
            fill="none" stroke="#F0B54D" stroke-width="23"/>
    </g>
  </g>
</svg>
