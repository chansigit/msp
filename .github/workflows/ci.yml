name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check msp tests
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check msp tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # agent-harness-bridge 0.2.0 (logging API) is not on PyPI yet; drop
          # this line once it is published.
          python -m pip install "git+https://github.com/chansigit/agent-harness-bridge.git@7e658bc"
          python -m pip install -e . pytest pytest-cov
      - name: Test
        run: python -m pytest --cov=msp --cov-report=term-missing --cov-fail-under=80
