[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "msp-sc"   # PyPI distribution name (plain "msp" is taken); the import name stays `msp`
version = "0.2.0"
description = "Multi-sample-pipeline: harmony integration of osp per-sample outputs, cluster QC inspection and cell-type annotation agents, self-contained HTML report"
readme = "README.md"
license = "MIT"
authors = [{ name = "chansigit", email = "chansigit@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Lower bounds name the oldest release with the APIs msp calls:
#   scanpy 1.10   leiden(flavor="igraph"), rank_genes_groups(pts=True) df schema
#   anndata 0.10  concat(join="outer", merge="same"), nullable obs round-trips
#   pandas 2.0    groupby(observed=True) everywhere, nullable "boolean" dtype
#   adjustText 1.0 adjust_text(expand=..., max_move=...)
dependencies = [
    "agent-harness-bridge==0.1.0",
    "scanpy>=1.10",
    "anndata>=0.10",
    "igraph>=0.10",
    # the torch-based release msp was validated on (PyPI 2.0.0 exists, untested;
    # Z_corr orientation handled in msp.integrate). harmonypy pulls in torch;
    # msp itself never imports it.
    "harmonypy==0.2.0",
    "standissect-lite>=0.2.0",
    # hierarchical cell-type palette for the annotation UMAPs. Not on PyPI yet:
    # switch to "stanhue>=1.1.0" as soon as it is, because PyPI rejects uploads
    # whose dependencies are direct URL references.
    "stanhue @ git+https://github.com/chansigit/stanhue.git@v1.1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "adjustText>=1.0",
]

[project.optional-dependencies]
agent = ["agent-harness-bridge[all]==0.1.0"]

[project.urls]
Homepage = "https://github.com/chansigit/msp"

[tool.setuptools]
packages = ["msp"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", ".msp-history"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF100"]
ignore = [
    "E501",  # long prompt/doc strings; the formatter handles code lines
    "C408",  # dict(k=v) keyword style is intentional for kwargs bundles
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "error::FutureWarning:msp",
]

[tool.coverage.run]
source = ["msp"]
omit = ["msp/harness.py"]

[tool.coverage.report]
fail_under = 80
