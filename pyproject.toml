[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "msp-sc"   # PyPI distribution name (plain "msp" is taken); the import name stays `msp`
version = "0.2.0"
description = "Multi-sample-pipeline: harmony integration of osp per-sample outputs, cluster QC inspection and cell-type annotation agents, self-contained HTML report"
readme = "README.md"
license = "MIT"
authors = [{ name = "chansigit", email = "chansigit@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "agent-harness-bridge==0.1.0",
    "scanpy",
    "anndata",
    "igraph",
    "harmonypy==0.2.0",   # the torch-based release msp was validated on (PyPI 2.0.0 exists, untested; Z_corr orientation handled in msp.integrate)
    "torch",
    "standissect-lite>=0.2.0",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "adjustText",
]

[project.optional-dependencies]
agent = ["agent-harness-bridge[all]==0.1.0"]

[project.urls]
Homepage = "https://github.com/chansigit/msp"

[tool.setuptools]
packages = ["msp"]
