[project]
name = "msp"
version = "0.1.0"
description = "Multi-sample scRNA-seq integration pipeline (harmony) over osp per-sample outputs"
requires-python = ">=3.10"
dependencies = ["scanpy", "harmonypy", "anndata", "pandas", "numpy", "scikit-learn"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["msp"]
